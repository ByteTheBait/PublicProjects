<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Every Map Is an Argument</title>
<style>
:root{--bg:#e8eef0;--ink:#0f212a;--mute:#4d6570;--panel:#f6f9fa;--line:#b9cbd2;--a1:#c2296b;--a2:#b87500;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1820;--ink:#e4eff2;--mute:#8fa9b3;--panel:#112631;--line:#264351;--a1:#ff6fa5;--a2:#f2b632}}
:root[data-theme="dark"]{--bg:#0b1820;--ink:#e4eff2;--mute:#8fa9b3;--panel:#112631;--line:#264351;--a1:#ff6fa5;--a2:#f2b632}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
#app{min-height:100%;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);grid-template-rows:auto 1fr}
header{grid-column:1/-1;padding:14px 20px 10px;border-bottom:1px solid var(--line)}
h1{font-size:1.35rem;margin:0 0 8px;font-weight:600;letter-spacing:.005em}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav button,#tis{font:inherit;font-size:.9rem;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 13px;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
#tis{margin-left:auto}#tis[aria-pressed="true"]{border-color:var(--a1);color:var(--a1)}
#map{position:relative;min-height:320px;height:100%}
#map canvas{display:block;touch-action:none;cursor:pointer}
aside{background:var(--panel);border-left:1px solid var(--line);padding:22px 26px 28px;overflow:auto}
aside h2{font-size:1.25rem;line-height:1.3;margin:4px 0 12px;font-weight:600}
.meta{color:var(--mute);font-size:.85rem;margin:0 0 4px;font-style:italic}
aside h3{font-size:.95rem;margin:16px 0 4px;color:var(--mute);font-weight:600}
aside p{line-height:1.6;margin:0;max-width:62ch;font-size:1rem}
#stat{margin-top:18px;padding:10px 12px;border-left:3px solid var(--a2);background:var(--bg);font-size:.92rem;line-height:1.45}
.foot{margin-top:16px;color:var(--mute);font-size:.82rem;line-height:1.5}
@media (max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:auto 58vh auto}#map{height:58vh}aside{border-left:0;border-top:1px solid var(--line)}#tis{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
<h1>Every Map Is an Argument</h1>
<nav id="tabs" aria-label="Map projection"></nav>
</header>
<div id="map"></div>
<aside id="essay" aria-live="polite"></aside>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script>
const D=Math.PI/180,PI=Math.PI;
const G=s=>{const a=s.trim().split(/\s+/).map(Number),o=[];for(let i=0;i<a.length;i+=2)o.push([a[i]*D,a[i+1]*D]);return o};
function dens(p,st=4*D){const o=[];for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length],n=Math.max(1,Math.ceil(Math.max(Math.abs(b[0]-a[0]),Math.abs(b[1]-a[1]))/st));for(let k=0;k<n;k++)o.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n])}return o}
let ant='';for(let l=-180;l<=180;l+=30)ant+=l+' '+(l%60?-71:-76)+' ';ant+='180 -90 -180 -90';
const LAND=[
['NA',"-168 66 -162 70 -156 71 -141 70 -128 70 -115 68 -95 72 -85 69 -82 63 -93 59 -94 58 -85 55 -79 52 -78 58 -77 62 -70 60 -65 60 -61 56 -56 52 -60 48 -66 45 -70 43 -70 41.5 -74 40 -76 37 -76 35 -81 31 -80 26 -82 26 -84 30 -90 30 -94 29 -97 27 -97 22 -95 18.5 -91 19 -90 21 -87 21 -88 16 -84 15.5 -83 11 -80 9 -77 8.5 -79 7.5 -83 8 -86 11 -88 13 -92 14.5 -96 15.7 -100 17 -105 20 -108 25 -112 29 -115 30 -117 32.5 -120 34.5 -123 38 -124 42 -124 47 -123 49 -127 51 -130 55 -135 58 -140 60 -147 61 -152 59 -158 57 -164 55 -158 58 -162 60 -165 62 -166 64"],
['GR',"-73 78 -60 82 -30 83.5 -18 80 -20 74 -22 70 -32 68 -40 65 -43 60 -50 62 -54 67 -58 75 -66 76"],
['SA',"-77 8.5 -72 12 -64 10.5 -60 8 -52 5 -50 0 -44 -2 -35 -5 -35 -9 -39 -14 -41 -22 -48 -26 -53 -34 -58 -35 -57 -38 -62 -39 -65 -42 -66 -47 -69 -51 -68 -54 -72 -53 -75 -48 -73 -40 -71 -30 -70 -18 -76 -14 -81 -6 -80 -2 -78 2"],
['AF',"-17 21 -16 28 -10 30 -6 36 10 37 11 33 20 31 25 32 32 31 34 28 38 20 43 12 51 12 47 5 41 -2 40 -10 40 -16 35 -24 33 -28 27 -34 19 -35 17 -30 12 -17 13 -9 9 -1 9 4 5 6 -4 5 -8 4.5 -13 8 -17 14.5"],
['EU',"-9 37 -9 43 -1 46 -4 48.5 2 51 8 54 8 57.5 10.5 57.5 10 54 14 54 21 55 24 59.5 30 60 23 60 21 63 25 65.5 22 65.8 17 61 19 59.5 16 56 13 55.5 11 58.5 6 58 5 62 14 67 20 70 28 71 33 69 41 67 44 68 54 68.5 60 69 68 69 73 72 80 73 88 75 100 77 112 74 130 71 140 72 160 70 170 70 180 69 180 65 170 60 162 57 156 51 150 59 142 59 136 54 141 52 140 48 133 43 129 41 129 35 126 35 126 38 122 40 118 38 122 37 120 33 122 30 119 25 110 21 108 21.5 106 19 109 12 105 9 101 13 100 8 103 1.5 100 4 98 9 98 16 94 17 92 22 88 22 85 20 80 15 80 10 77 8 73 17 72 21 68 24 62 25 57 26 56 27 51 28 48 30 50 26 52 24 56 26 59 22 55 17 45 13 43 15 39 21 35 28 34.5 31 35 33 36 36.5 30 36.5 27 37 26.5 40 24 40.5 23 38 22 36.5 20 40 19 42 13.5 45.5 12.5 44 16 41 18 40 16 38 15.5 40 12 42 9 44.3 3 43.3 3 42 0 39 -1 37 -5 36"],
['UK',"-6 50 1 51 -2 56 -5 58.5 -6 56 -3 54 -5 52"],
['IS',"-24 64 -14 64.5 -14 66 -22 66"],
['JP',"130 31 132 34 136 34 140 35.5 142 39.5 141.5 45 145 43.5 141 41 140 38 136 37 131 34.5"],
['SU',"95 5 104 -2 106 -6 101 -3"],
['BO',"109 1 117 7 119 1 116 -4 110 -3"],
['AU',"114 -22 122 -18 130 -12 137 -12 137 -16 142 -11 146 -19 153 -26 151 -34 146 -39 141 -38 135 -35 130 -32 124 -34 115 -34 113 -26"],
['NZ',"172 -34 178 -38 175 -41 172 -41 174 -42 170 -46 167 -46"],
['MD',"44 -25 47 -25 50 -15 49 -12 44 -17"],
['AN',ant]
].map(([k,s])=>({k,p:dens(G(s))}));
const byK=k=>LAND.find(l=>l.k===k).p;
const GRAT=[];
for(let l=-180;l<=180;l+=30){const a=[];for(let p=-90;p<=90;p+=5)a.push([l*D,p*D]);GRAT.push(a)}
for(let p=-60;p<=60;p+=30){const a=[];for(let l=-180;l<=180;l+=5)a.push([l*D,p*D]);GRAT.push(a)}
const RX=[1,.9986,.9954,.99,.9822,.973,.96,.9427,.9216,.8962,.8679,.835,.7986,.7597,.7186,.6732,.6213,.5722,.5322];
const RY=[0,.062,.124,.186,.248,.31,.372,.434,.4958,.5571,.6176,.6769,.7346,.7903,.8435,.8936,.9394,.9761,1];
const S={l0:20*D,p0:20*D};
function rob(l,p){const a=Math.abs(p)/D/5,i=Math.min(17,Math.floor(a)),t=a-i;return[.8487*(RX[i]+(RX[i+1]-RX[i])*t)*l,1.3523*(RY[i]+(RY[i+1]-RY[i])*t)*Math.sign(p)]}
function ortho(l,p){const d=l-S.l0,c=Math.sin(S.p0)*Math.sin(p)+Math.cos(S.p0)*Math.cos(p)*Math.cos(d);let x=Math.cos(p)*Math.sin(d),y=Math.cos(S.p0)*Math.sin(p)-Math.sin(S.p0)*Math.cos(p)*Math.cos(d);if(c<0){const r=Math.hypot(x,y)||1;return[x/r,y/r,0]}return[x,y,1]}
function polar(l,p){const r=PI/2-p,a=l-S.l0;return[r*Math.sin(a),-r*Math.cos(a),1]}
const P=[
{n:'Mercator',hw:PI,hh:3.13,rect:85,f:(l,p)=>{p=Math.max(-85*D,Math.min(85*D,p));return[l,Math.log(Math.tan(PI/4+p/2))]},
 yr:'1569',move:'Borrowed authority: a navigator\u2019s tool read as neutral truth',
 claim:'Mercator argues that the world is built for the traveler, and that the north is where the weight of the world sits.',
 ev:'The projection stretches every place by 1/cos(latitude) so that a constant compass bearing plots as a straight line. The price is scale: Greenland, about 2.2 million km\u00b2, swells to rival Africa, which is really about fourteen times larger. Antarctica smears across the bottom like a wall of ice.',
 co:'A sailor\u2019s convenience became a classroom default, so its argument arrives without ever being stated. Europe and North America look vast, central and important; the tropics look peripheral. The rhetoric works through repetition and familiarity, which is why the claim feels like fact.'},
{n:'Gall\u2013Peters',hw:.7071*PI,hh:1.4142,rect:90,f:(l,p)=>[.7071*l,1.4142*Math.sin(p)],
 yr:'1855; promoted 1973',move:'Appeal to justice: a correction presented as a moral duty',
 claim:'Equal-area mapping argues from fairness: every square kilometer deserves the same ink.',
 ev:'This projection preserves area exactly, so Africa and South America regain their true bulk while Europe and Canada shrink. In exchange, shapes are pulled tall near the equator and flattened near the poles, so continents look stretched like taffy.',
 co:'Arno Peters launched it in 1973 as a rebuke to colonial-era bias, an appeal to ethos and moral urgency. Yet the design was James Gall\u2019s, decades earlier, and cartographers noted that it swaps one distortion for another. The map shows that a correction is still an argument: it chooses which truth to keep.'},
{n:'Robinson',hw:.8487*PI,hh:1.3523,rect:90,f:rob,
 yr:'1963',move:'Concession: appeasing both sides by refusing to pick one',
 claim:'The compromise map argues that moderation is itself a stance.',
 ev:'Arthur Robinson tuned his projection by eye, using a lookup table instead of a formula. Meridians curve and the poles flatten into lines, so nothing is exactly right and nothing is badly wrong. National Geographic adopted it in 1988 and replaced it in 1998 with the Winkel Tripel.',
 co:'Its rhetoric is concession, defusing the fight between Mercator and Peters by giving each side a little. The cost is that distortion becomes hard to see, so viewers trust it because it looks reasonable. That is the golden-mean fallacy in map form: the middle is not automatically the truth.'},
{n:'Globe',hw:1,hh:1,round:1,rot:1,f:ortho,
 yr:'View from space, 1972',move:'Pathos through photographic authority',
 claim:'The globe argues for unity and fragility, while withholding half of the evidence.',
 ev:'Seen from space, as in the 1972 Blue Marble photograph, Earth is a single bounded object. Places at the center keep their true look while those at the edge crush into slivers, and at any moment half the planet is hidden. Drag to turn it and watch continents slide out of view.',
 co:'The orthographic view borrows a camera\u2019s credibility and the emotion of a small, shared home, a powerful appeal for environmental causes. But the viewer floats outside the world, a god\u2019s-eye position that turns nations into scenery and leaves whoever is on the far side unseen.'},
{n:'Polar (UN)',hw:PI,hh:PI,round:1,rot:1,f:polar,
 yr:'1945',move:'Choice of center as thesis',
 claim:'Centering the North Pole argues that the world is one community around a shared table, and quietly puts some people at the head.',
 ev:'The United Nations emblem uses this azimuthal equidistant view, wreathed in olive branches, so that no single nation sits in the middle. Distances from the pole are true, but the southern continents spread into a wide outer ring, and the emblem itself trims everything below about 60\u00b0S.',
 co:'The design softens Eurocentrism and signals cooperation, yet the Arctic and northern powers cluster near the hub while the Global South splays along the rim. Whoever sits at the center appears to be hosting the meeting, and the omissions at the edge argue as loudly as what is drawn.'}
];
const ar=q=>{let a=0;for(let i=0;i<q.length;i++){const b=q[(i+1)%q.length];a+=q[i][0]*b[1]-b[0]*q[i][1]}return Math.abs(a)/2};
const ea=p=>ar(p.map(q=>[.7071*q[0],1.4142*Math.sin(q[1])]));
const AF=byK('AF'),GRN=byK('GR'),R0=ea(AF)/ea(GRN);
let W=100,H=100,cx=50,cy=50,cur={i:0,from:P[0],to:P[0],t:1,e:1},tis=false,pal,drag=false,dist=0;
const sc=pr=>Math.min(W*.94/(2*pr.hw),H*.94/(2*pr.hh));
function xy(pr,l,p){const q=pr.f(l,p),s=sc(pr);return[cx+q[0]*s,cy-q[1]*s,q[2]!==0]}
function lay(pts){const b=cur.to,a=cur.from,t=cur.e;return pts.map(q=>{const B=xy(b,q[0],q[1]);if(t>=1)return B;const A=xy(a,q[0],q[1]);return[A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,B[2]]})}
function outl(pr){const s=sc(pr),o=[];for(let i=0;i<200;i++){let x,y;if(pr.round){const a=i/200*2*PI;x=pr.hw*Math.cos(a);y=pr.hw*Math.sin(a)}else{const m=pr.rect*D,k=Math.floor(i/50),u=(i%50)/50;let l,p;if(k==0){l=-PI+u*2*PI;p=m}else if(k==1){l=PI;p=m-u*2*m}else if(k==2){l=PI-u*2*PI;p=-m}else{l=-PI;p=-m+u*2*m}const q=pr.f(l,p);x=q[0];y=q[1]}o.push([cx+x*s,cy-y*s])}return o}
function circ(l,p,r=7*D){const o=[];for(let k=0;k<24;k++){const b=k/24*2*PI,p2=Math.asin(Math.sin(p)*Math.cos(r)+Math.cos(p)*Math.sin(r)*Math.cos(b));o.push([l+Math.atan2(Math.sin(b)*Math.sin(r)*Math.cos(p),Math.cos(r)-Math.sin(p)*Math.sin(p2)),p2])}return o}
const TIS=[];for(let l=-150;l<=150;l+=60)for(let p=-60;p<=60;p+=30)TIS.push([l*D,p*D]);
function poly(pts){let open=false;for(const q of pts){if(q[2]){if(!open){beginShape();open=true}vertex(q[0],q[1])}else if(open){endShape();open=false}}if(open)endShape()}
function colors(){const t=document.documentElement.dataset.theme,d=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
return d?{ocean:'#12303c',land:'#4d6c78',ink:'#e4eff2',grat:'rgba(228,239,242,.16)',a1:'#ff6fa5',a2:'#f2b632',tx:'#0b1820'}:{ocean:'#cfdee4',land:'#8ea6b0',ink:'#0f212a',grat:'rgba(15,33,42,.16)',a1:'#c2296b',a2:'#b87500',tx:'#0f212a'}}
function setup(){const m=document.getElementById('map');W=m.clientWidth;H=m.clientHeight;const c=createCanvas(W,H);c.parent('map');pixelDensity(Math.min(2,window.devicePixelRatio||1));textFont('Georgia');build()}
function windowResized(){const m=document.getElementById('map');W=m.clientWidth;H=m.clientHeight;resizeCanvas(W,H);cx=W/2;cy=H/2}
function draw(){
 cx=W/2;cy=H/2;if(frameCount%20==1)pal=colors();clear();
 if(cur.t<1)cur.t=Math.min(1,cur.t+deltaTime/900);cur.e=1-Math.pow(1-cur.t,3);
 const oa=outl(cur.from),ob=outl(cur.to),e=cur.e;
 fill(pal.ocean);stroke(pal.ink);strokeWeight(1.2);
 beginShape();for(let i=0;i<200;i++)vertex(oa[i][0]+(ob[i][0]-oa[i][0])*e,oa[i][1]+(ob[i][1]-oa[i][1])*e);endShape(CLOSE);
 noFill();stroke(pal.grat);strokeWeight(1);GRAT.forEach(l=>poly(lay(l)));
 strokeWeight(.8);
 for(const L of LAND){const q=lay(L.p);if(q.every(v=>!v[2]))continue;
  fill(L.k==='GR'?pal.a1:L.k==='AF'?pal.a2:pal.land);stroke(pal.ink);
  beginShape();q.forEach(v=>vertex(v[0],v[1]));endShape(CLOSE)}
 if(tis){stroke(pal.ink);strokeWeight(1);for(const c of TIS){if(!xy(cur.to,c[0],c[1])[2])continue;const q=lay(circ(c[0],c[1]));fill(255,255,255,70);beginShape();q.forEach(v=>vertex(v[0],v[1]));endShape(CLOSE)}}
 noStroke();textAlign(CENTER,CENTER);textSize(Math.max(12,Math.min(16,W/48)));textStyle(BOLD);
 for(const [k,n,c] of [['GR','Greenland',pal.a1],['AF','Africa',pal.a2]]){const q=lay(byK(k));if(!q.every(v=>v[2]))continue;let x=0,y=0;q.forEach(v=>{x+=v[0];y+=v[1]});fill(pal.tx);text(n,x/q.length,y/q.length)}
 textStyle(NORMAL);textAlign(LEFT,BOTTOM);textSize(12);fill(pal.ink);
 text(cur.to.rot?'Drag to rotate \u2022 click to change projection':'Click the map to change projection',12,H-10);
 if(frameCount%8==0)stat();
}
function stat(){const el=document.getElementById('stat');if(!el||cur.t<1)return;const A=lay(AF),g=lay(GRN);
 if(!A.every(v=>v[2])||!g.every(v=>v[2])){el.textContent='Africa or Greenland is partly hidden from this vantage point.';return}
 const r=ar(A)/ar(g)/R0*14;el.innerHTML='In this projection Africa appears about <b>'+r.toFixed(1)+'\u00d7</b> the size of Greenland. In reality it is about <b>14\u00d7</b>.'}
function build(){
 const tabs=document.getElementById('tabs');
 P.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p.n;b.onclick=()=>go(i);b.setAttribute('aria-pressed',i==0);tabs.appendChild(b)});
 const t=document.createElement('button');t.id='tis';t.textContent='Show distortion circles';t.setAttribute('aria-pressed','false');t.onclick=()=>{tis=!tis;t.setAttribute('aria-pressed',tis)};tabs.appendChild(t);
 show(0)}
function show(i){const p=P[i];document.getElementById('essay').innerHTML=
 '<p class="meta">'+p.n+', '+p.yr+'</p><h2>'+p.claim+'</h2>'+
 '<h3>Rhetorical move</h3><p>'+p.move+'.</p><h3>Evidence</h3><p>'+p.ev+'</p><h3>Commentary</h3><p>'+p.co+'</p>'+
 '<div id="stat"></div><p class="foot">Every projection flattens a sphere, so every map must choose what to distort. That choice is the argument.</p>';
 [...document.querySelectorAll('#tabs button:not(#tis)')].forEach((b,k)=>b.setAttribute('aria-pressed',k==i))}
function go(i){if(i===cur.i&&cur.t>=1)return;cur={i,from:cur.to,to:P[i],t:0,e:0};show(i)}
const inMap=()=>mouseX>=0&&mouseX<=W&&mouseY>=0&&mouseY<=H;
function mousePressed(){drag=false;dist=0}
function mouseDragged(){if(!inMap()&&dist==0)return;dist+=Math.abs(movedX)+Math.abs(movedY);if(dist>6)drag=true;if(drag&&cur.to.rot){S.l0-=movedX*.008;if(cur.to===P[3])S.p0=Math.max(-80*D,Math.min(80*D,S.p0+movedY*.008))}}
function mouseReleased(){if(inMap()&&!drag&&dist<=6)go((cur.i+1)%P.length)}
function keyPressed(){if(keyCode===RIGHT_ARROW)go((cur.i+1)%P.length);else if(keyCode===LEFT_ARROW)go((cur.i+P.length-1)%P.length);else if(key==='t'||key==='T')document.getElementById('tis').click()}
</script>
</body>
</html>
