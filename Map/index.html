<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Projection Distortion Visualizer</title>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-geo-projection@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      padding: 1rem 1.5rem;
      background-color: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .controls {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    select, input, button {
      background-color: #0f172a;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 0.5rem 0.75rem;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      outline: none;
    }

    select:focus, input:focus, button:focus {
      border-color: #38bdf8;
    }

    button {
      background-color: #0284c7;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #0369a1;
    }

    .main-container {
      display: flex;
      flex: 1;
      position: relative;
    }

    #map-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
    }

    svg {
      width: 100%;
      height: 100%;
      background-color: #0b1329;
    }

    /* Map styling */
    .sphere {
      fill: #1e293b;
      stroke: #334155;
      stroke-width: 1px;
    }

    .graticule {
      fill: none;
      stroke: #334155;
      stroke-width: 0.5px;
      stroke-dasharray: 2,2;
    }

    .land {
      fill: #334155;
      stroke: #475569;
      stroke-width: 0.5px;
    }

    /* Distortion indicators */
    .vector-line {
      stroke: #f43f5e;
      stroke-width: 1.5px;
      stroke-dasharray: 4,4;
    }

    .point-reference {
      fill: #38bdf8;
      stroke: #0f172a;
      stroke-width: 1px;
    }

    .point-projected {
      fill: #f43f5e;
      stroke: #0f172a;
      stroke-width: 1px;
    }

    .city-label {
      font-size: 10px;
      fill: #e2e8f0;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }

    .legend {
      position: absolute;
      bottom: 1.5rem;
      left: 1.5rem;
      background-color: rgba(30, 41, 59, 0.9);
      padding: 0.75rem 1rem;
      border-radius: 0.5rem;
      border: 1px solid #334155;
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      backdrop-filter: blur(4px);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .legend-line {
      width: 16px;
      height: 2px;
      border-top: 2px dashed #f43f5e;
    }
  </style>
</head>
<body>

  <header>
    <h1>Projection Displacement Visualizer</h1>
    <div class="controls">
      <div class="search-box">
        <input type="text" id="city-search" placeholder="Add city (e.g., Cairo)...">
        <button id="search-btn">Add</button>
      </div>
      <label for="projection-select" style="font-size: 0.875rem;">Projection:</label>
      <select id="projection-select">
        <option value="mercator">Mercator (Conformal)</option>
        <option value="mollweide">Mollweide (Equal Area)</option>
        <option value="orthographic">Orthographic (3D Globe)</option>
        <option value="stereographic">Stereographic</option>
      </select>
    </div>
  </header>

  <div class="main-container">
    <div id="map-container">
      <svg id="map"></svg>
    </div>

    <div class="legend">
      <div class="legend-item">
        <div class="legend-dot" style="background-color: #38bdf8;"></div>
        <span>True Position (Equirectangular Reference)</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background-color: #f43f5e;"></div>
        <span>Projected Position</span>
      </div>
      <div class="legend-item">
        <div class="legend-line"></div>
        <span>Displacement Vector</span>
      </div>
    </div>
  </div>

  <script>
    // Map dimensions
    const width = window.innerWidth;
    const height = window.innerHeight - 60;

    const svg = d3.select("#map")
      .attr("width", width)
      .attr("height", height);

    // Default Cities [Longitude, Latitude]
    let cities = [
      { name: "London", coords: [-0.1276, 51.5074] },
      { name: "New York", coords: [-74.0060, 40.7128] },
      { name: "Tokyo", coords: [139.6917, 35.6895] },
      { name: "Sydney", coords: [151.2093, -33.8688] },
      { name: "Cairo", coords: [31.2357, 30.0444] },
      { name: "Rio de Janeiro", coords: [-43.1729, -22.9068] },
      { name: "Reykjavik", coords: [-21.9426, 64.1466] }
    ];

    // Define Reference Projection (Unprojected Equirectangular plate carrée)
    const refProjection = d3.geoEquirectangular()
      .scale(height / 3.5)
      .translate([width / 2, height / 2]);

    // Define Target Projections
    const targetProjections = {
      mercator: d3.geoMercator().scale(height / 5.5).translate([width / 2, height / 1.6]),
      mollweide: d3.geoMollweide().scale(height / 3.2).translate([width / 2, height / 2]),
      orthographic: d3.geoOrthographic().scale(height / 2.5).translate([width / 2, height / 2]),
      stereographic: d3.geoStereographic().scale(height / 4).translate([width / 2, height / 2])
    };

    let currentTargetKey = "mercator";

    // Load TopoJSON World Data
    d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(data => {
      const land = topojson.feature(data, data.objects.land);

      // Render static background components using target projection
      draw(land);

      // Event Listener for Projection Switch
      d3.select("#projection-select").on("change", function() {
        currentTargetKey = this.value;
        draw(land);
      });

      // Event Listener for Searching Locations
      d3.select("#search-btn").on("click", () => searchLocation(land));
      d3.select("#city-search").on("keypress", (e) => {
        if (e.key === "Enter") searchLocation(land);
      });
    });

    function draw(land) {
      svg.selectAll("*").remove(); // Clear layer

      const targetProj = targetProjections[currentTargetKey];
      const pathGenerator = d3.geoPath().projection(targetProj);
      const graticule = d3.geoGraticule();

      // Render Globe Background Boundary
      svg.append("path")
        .datum({type: "Sphere"})
        .attr("class", "sphere")
        .attr("d", pathGenerator);

      // Render Graticule Lines
      svg.append("path")
        .datum(graticule)
        .attr("class", "graticule")
        .attr("d", pathGenerator);

      // Render Landmasses
      svg.append("path")
        .datum(land)
        .attr("class", "land")
        .attr("d", pathGenerator);

      // Render Cities & Vectors
      cities.forEach(city => {
        const truePos = refProjection(city.coords);
        const projPos = targetProj(city.coords);

        // Hide points clipping outside target boundary (for Orthographic)
        if (!projPos || isNaN(projPos[0]) || isNaN(projPos[1])) return;

        // 1. Draw Displacement Vector Line
        svg.append("line")
          .attr("class", "vector-line")
          .attr("x1", truePos[0])
          .attr("y1", truePos[1])
          .attr("x2", projPos[0])
          .attr("y2", projPos[1]);

        // 2. Draw True Location Point (Reference)
        svg.append("circle")
          .attr("class", "point-reference")
          .attr("cx", truePos[0])
          .attr("cy", truePos[1])
          .attr("r", 4);

        // 3. Draw Projected Location Point
        svg.append("circle")
          .attr("class", "point-projected")
          .attr("cx", projPos[0])
          .attr("cy", projPos[1])
          .attr("r", 4);

        // 4. Draw Label
        svg.append("text")
          .attr("class", "city-label")
          .attr("x", projPos[0] + 7)
          .attr("y", projPos[1] + 3)
          .text(city.name);
      });
    }

    // Geocoding via Nominatim API
    async function searchLocation(land) {
      const query = d3.select("#city-search").property("value");
      if (!query) return;

      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
        const results = await response.json();

        if (results.length > 0) {
          const firstResult = results[0];
          cities.push({
            name: firstResult.display_name.split(',')[0],
            coords: [parseFloat(firstResult.lon), parseFloat(firstResult.lat)]
          });
          d3.select("#city-search").property("value", "");
          draw(land);
        } else {
          alert("Location not found.");
        }
      } catch (err) {
        console.error("Geocoding error:", err);
      }
    }
  </script>
</body>
</html>
